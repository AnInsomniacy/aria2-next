name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    name: CMake Build and Test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate scripts
        run: |
          bash -n tools/build_test.sh
          bash -n scripts/bump-version.sh
          bash -n scripts/release.sh
          bash -n packaging/scripts/common.sh
          bash -n packaging/scripts/build-release
          bash -n packaging/scripts/check-runtime-deps
          bash -n packaging/scripts/verify-runner-tools

      - name: Verify runner tools
        run: packaging/scripts/verify-runner-tools ci

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default

      - name: Test
        run: ctest --preset default

      - name: Verify binary version
        run: build/default/aria2-next --version
